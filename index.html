<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>glry &ndash; MEHMET BATTAL</title>
        <meta
            name="description"
            content="Swipe is an ongoing series created artificially by Felipe Rocha as part of our research on A.I. generated images at PORTO ROCHA."
        />
        <style>
            /* ─── Reset ─────────────────────────────────────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html,
            body,
            p,
            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                margin: 0;
                padding: 0;
                border: 0;
                font-size: inherit;
                font-weight: inherit;
            }
            a {
                text-decoration: none;
                outline: 0;
            }
            img,
            svg {
                vertical-align: middle;
                user-select: none;
                -webkit-user-drag: none;
            }
            button,
            input {
                font-family: inherit;
                font-size: inherit;
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
            }

            /* ─── Custom Properties ──────────────────────────────────── */
            :root {
                --page-mg: 16px;
                --home-i-i-i-rg: 40px;
                --home-i-i-i-pd: 50px;
                --duration: 0.5s;
            }
            @media screen and (min-width: 390px) {
                :root {
                    --page-mg: calc(
                        16px + (20 - 16) * (100vw - 390px) / (1920 - 390)
                    );
                    --home-i-i-i-rg: calc(
                        40px + (80 - 40) * (100vw - 390px) / (1920 - 390)
                    );
                    --home-i-i-i-pd: calc(
                        50px + (100 - 50) * (100vw - 390px) / (1920 - 390)
                    );
                }
            }

            /* ─── Base ───────────────────────────────────────────────── */
            html {
                font-size: 0.5208333vw;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
            }
            @media (max-width: 768px) {
                html {
                    font-size: 2.564102vw;
                }
            }

            body {
                font-family: Georgia, "Times New Roman", serif;
                font-size: 16px;
                line-height: 1.2;
                background-color: #fff;
                color: #000;
                min-width: 360px;
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
                transition:
                    background-color var(--duration),
                    color var(--duration);
            }
            body.dark {
                background-color: #000;
                color: #fff;
            }

            /* ─── Wrapper ────────────────────────────────────────────── */
            main.wrapper {
                height: 100vh;
                overflow-x: hidden;
                overflow-y: scroll;
                scroll-behavior: smooth;
            }

            /* ─── Nav Grid Rows ──────────────────────────────────────── */
            .nav__top,
            .nav__bottom {
                display: grid;
                grid-template-columns: repeat(16, 1fr);
                column-gap: var(--page-mg);
                padding: 0 var(--page-mg);
            }
            @media (max-width: 768px) {
                .nav__top,
                .nav__bottom {
                    grid-template-columns: repeat(6, 1fr);
                }
            }

            /* ─── Fixed Nav ──────────────────────────────────────────── */
            nav {
                display: flex;
                flex-flow: column;
                justify-content: space-between;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 100vh;
                z-index: 10;
                pointer-events: none;
                /* mix-blend-mode trick: text is white but blends to appear black on white bg */
                mix-blend-mode: difference;
                color: #fff;
            }

            .nav__top {
                padding-top: 15px;
                padding-bottom: 15px;
                align-items: center;
            }
            .nav__bottom {
                padding-bottom: 16px;
                align-items: flex-end;
            }

            /* Counter (top-left) */
            .nav__top__counter {
                grid-column: 1 / 4;
                grid-row: 1;
                display: flex;
                pointer-events: none;
                user-select: none;
            }
            @media (max-width: 768px) {
                .nav__top__counter {
                    display: none;
                }
            }

            /* Images count label — same grid cell as counter, toggled via JS */
            .nav__top__count-label {
                grid-column: 1 / 4;
                grid-row: 1;
                display: none;
                pointer-events: none;
            }
            .nav__top__count-label.visible {
                display: flex;
            }
            @media (max-width: 768px) {
                .nav__top__count-label {
                    display: none !important;
                }
            }

            /* Title */
            .nav__top__title {
                grid-column: 4 / 11;
                grid-row: 1;
                white-space: nowrap;
                display: flex;
                cursor: default;
            }
            @media (max-width: 768px) {
                .nav__top__title {
                    grid-column: 1 / 4;
                }
            }

            /* About button */
            .nav__top__about {
                grid-column: 11 / 14;
                grid-row: 1;
                display: flex;
                justify-content: flex-start;
                pointer-events: auto;
                cursor: pointer;
                margin: -10px;
                padding: 10px;
            }
            @media (max-width: 768px) {
                .nav__top__about {
                    grid-column: 5 / 6;
                }
            }

            /* Right buttons: Index, Feed, Close */
            .nav__top__right-btns {
                grid-column: 14 / 17;
                grid-row: 1;
                display: flex;
                justify-content: flex-end;
                gap: 16px;
                pointer-events: auto;
            }
            @media (max-width: 768px) {
                .nav__top__right-btns {
                    grid-column: 6 / 7;
                }
            }

            .nav-btn {
                pointer-events: auto;
                cursor: pointer;
                margin: -10px;
                padding: 10px;
                transition: opacity 0.3s;
            }
            .nav-btn:hover {
                opacity: 0.5;
            }
            .nav-btn.hidden {
                display: none;
            }

            /* Bottom: mobile counter + light/dark */
            .nav__bottom__mobile-counter {
                grid-column: 1 / 3;
                pointer-events: none;
                user-select: none;
            }
            @media (min-width: 769px) {
                .nav__bottom__mobile-counter {
                    display: none;
                }
            }

            .nav__bottom__modes {
                grid-column: -3 / -1;
                justify-self: flex-end;
                display: flex;
                column-gap: 10px;
                pointer-events: auto;
            }

            .mode-btn {
                cursor: pointer;
                margin: -10px;
                padding: 10px;
                transition: opacity 0.3s;
            }
            .mode-btn:hover {
                opacity: 0.5;
            }
            .mode-btn.active {
                opacity: 0.4;
            }

            /* ─── Feed View ──────────────────────────────────────────── */
            .home__feed {
                display: flex;
                flex-flow: column;
                align-items: center;
                padding: 100px 0 140px;
                gap: 100px;
                pointer-events: none;
            }
            @media (max-width: 768px) {
                .home__feed {
                    gap: 64px;
                    padding: 80px 0 100px;
                }
            }

            .feed-item {
                display: flex;
                flex-flow: column;
                align-items: center;
                gap: 8px;
                padding: 0 var(--page-mg);
            }

            .feed-item__label {
                pointer-events: none;
                font-size: 11px;
                opacity: 0.4;
                color: #000;
                transition: color var(--duration);
                align-self: flex-start;
            }
            body.dark .feed-item__label p {
                color: #fff;
            }
            @media (max-width: 768px) {
                .feed-item__label {
                    display: none;
                }
            }

            .feed-item__img {
                cursor: zoom-in;
                pointer-events: auto;
                max-height: clamp(100px, 18vh, 220px);
                max-width: min(38vw, 320px);
                /* pop-in initial state */
                opacity: 0;
                transform: scale(0.55) translateY(24px);
                transition:
                    opacity 0.55s cubic-bezier(0.34, 1.4, 0.64, 1),
                    transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
            }
            .feed-item__img.popped {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            .feed-item__img img {
                display: block;
                max-height: clamp(100px, 18vh, 220px);
                max-width: min(38vw, 320px);
                width: auto;
                height: auto;
                object-fit: contain;
            }

            /* ─── Index View ─────────────────────────────────────────── */
            .home__index {
                position: fixed;
                inset: 0;
                z-index: 5;
                overflow-y: auto;
                background-color: #fff;
                visibility: hidden;
                opacity: 0;
                transition:
                    opacity 0.4s,
                    visibility 0.4s,
                    background-color var(--duration);
            }
            body.dark .home__index {
                background-color: #000;
            }
            .home__index.open {
                visibility: visible;
                opacity: 1;
            }

            .home__index__inner {
                display: grid;
                grid-template-columns: repeat(8, 1fr);
                column-gap: var(--page-mg);
                row-gap: var(--home-i-i-i-rg);
                align-items: flex-start;
                padding: var(--home-i-i-i-pd) var(--page-mg);
            }
            @media (max-width: 1440px) {
                .home__index__inner {
                    grid-template-columns: repeat(7, 1fr);
                }
            }
            @media (max-width: 1024px) {
                .home__index__inner {
                    grid-template-columns: repeat(6, 1fr);
                }
            }
            @media (max-width: 768px) {
                .home__index__inner {
                    grid-template-columns: repeat(4, 1fr);
                }
            }
            @media (max-width: 544px) {
                .home__index__inner {
                    grid-template-columns: repeat(3, 1fr);
                }
            }

            .index-thumb {
                cursor: pointer;
                display: flex;
                flex-flow: column;
                gap: 6px;
            }
            .index-thumb__img {
                position: relative;
                width: 100%;
                overflow: hidden;
                background-color: #f0f0f0;
                transition: background-color var(--duration);
            }
            body.dark .index-thumb__img {
                background-color: #1a1a1a;
            }
            .index-thumb__img img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            .index-thumb:hover .index-thumb__img img {
                transform: scale(1.03);
            }
            .index-thumb__num {
                font-size: 12px;
                opacity: 0.4;
                color: #000;
                transition: color var(--duration);
            }
            body.dark .index-thumb__num {
                color: #fff;
            }

            /* ─── Zoom View ──────────────────────────────────────────── */
            .home__zoom {
                position: fixed;
                inset: 0;
                z-index: 6;
                overflow-y: auto;
                visibility: hidden;
                background-color: #fff;
                opacity: 0;
                transition:
                    opacity 0.4s,
                    visibility 0.4s,
                    background-color var(--duration);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            body.dark .home__zoom {
                background-color: #000;
            }
            .home__zoom.open {
                visibility: visible;
                opacity: 1;
            }

            .zoom-img-wrap {
                position: relative;
                max-height: 90vh;
                max-width: 90vw;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .zoom-img-wrap img {
                max-height: 90vh;
                max-width: 90vw;
                object-fit: contain;
                display: block;
            }

            .zoom-prev,
            .zoom-next {
                position: fixed;
                top: 0;
                bottom: 0;
                width: 50%;
                cursor: none;
                z-index: 7;
            }
            .zoom-prev {
                left: 0;
            }
            .zoom-next {
                right: 0;
            }

            .zoom-cursor {
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 8;
                mix-blend-mode: difference;
                color: #fff;
                transform: translate(-100px, -100px);
                opacity: 0;
                transition: opacity 0.2s;
            }
            .zoom-cursor.visible {
                opacity: 1;
            }

            /* ─── About Overlay ──────────────────────────────────────── */
            .about-modal {
                position: fixed;
                inset: 0;
                z-index: 9;
                visibility: hidden;
                pointer-events: none;
            }
            .about-modal.open {
                visibility: visible;
                pointer-events: auto;
            }

            .about-bg {
                position: fixed;
                inset: 0;
                background-color: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(17px);
                -webkit-backdrop-filter: blur(17px);
                opacity: 0;
                transition:
                    opacity 0.4s,
                    background-color var(--duration);
            }
            body.dark .about-bg {
                background-color: rgba(0, 0, 0, 0.9);
            }
            .about-modal.open .about-bg {
                opacity: 1;
            }

            .about-inner {
                position: absolute;
                inset: 0;
                display: grid;
                grid-template-columns: repeat(16, 1fr);
                column-gap: var(--page-mg);
                padding: 0 var(--page-mg);
            }
            @media (max-width: 768px) {
                .about-inner {
                    grid-template-columns: repeat(6, 1fr);
                }
            }

            .about-inner__content {
                grid-column: 11 / 14;
                grid-row: 1;
                display: flex;
                flex-flow: column;
                transform: translateX(20px);
                opacity: 0;
                transition:
                    transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                    opacity 0.4s;
            }
            @media (max-width: 1440px) {
                .about-inner__content {
                    grid-column: 11 / 15;
                }
            }
            @media (max-width: 1024px) {
                .about-inner__content {
                    grid-column: 11 / 16;
                }
            }
            @media (max-width: 768px) {
                .about-inner__content {
                    grid-column: 1 / -1;
                }
            }

            .about-modal.open .about-inner__content {
                transform: translateX(0);
                opacity: 1;
            }

            .about-top {
                margin-top: 63px;
                flex: auto;
            }

            .about-text {
                text-indent: 2.5em;
                color: #000;
                transition: color var(--duration);
            }
            body.dark .about-text {
                color: #fff;
            }
            .about-text a {
                color: #000;
                text-decoration: underline;
                transition: color var(--duration);
            }
            body.dark .about-text a {
                color: #fff;
            }

            .about-book-btn {
                display: flex;
                align-items: flex-start;
                margin: 32px 0;
                padding: 8px 0;
                column-gap: 8px;
                border-top: 1px solid rgba(0, 0, 0, 0.12);
                border-bottom: 1px solid rgba(0, 0, 0, 0.12);
                transition: border-color var(--duration);
            }
            body.dark .about-book-btn {
                border-color: rgba(255, 255, 255, 0.12);
            }

            .about-book-thumb {
                flex-shrink: 0;
                width: 69px;
                aspect-ratio: 69/90;
                background-color: rgba(0, 0, 0, 0.1);
                transition: background-color var(--duration);
            }
            body.dark .about-book-thumb {
                background-color: rgba(255, 255, 255, 0.1);
            }

            .about-book-info {
                display: flex;
                flex-flow: column;
                align-items: flex-start;
                justify-content: space-between;
                gap: 8px;
            }
            .about-book-title {
                color: #000;
                transition: color var(--duration);
            }
            body.dark .about-book-title {
                color: #fff;
            }
            .about-book-price {
                flex: 1;
                margin-bottom: 10px;
                color: #000;
                transition: color var(--duration);
            }
            body.dark .about-book-price {
                color: #fff;
            }
            .about-buy-btn {
                padding: 3px 12px;
                background-color: #000;
                border-radius: 50px;
                cursor: pointer;
                transition: background-color var(--duration);
            }
            body.dark .about-buy-btn {
                background-color: #fff;
            }
            .about-buy-btn p {
                color: #fff;
                transition: color var(--duration);
            }
            body.dark .about-buy-btn p {
                color: #000;
            }

            .about-bottom {
                padding: 16px 0;
            }
            .about-bottom-header {
                opacity: 0.4;
                color: #000;
                transition: color var(--duration);
            }
            body.dark .about-bottom-header {
                color: #fff;
            }
            .about-bottom-links {
                display: flex;
                column-gap: 20px;
                margin-top: 8px;
            }
            .about-bottom-link {
                cursor: pointer;
                color: #000;
                transition:
                    color var(--duration),
                    opacity 0.3s;
            }
            .about-bottom-link:hover {
                opacity: 0.5;
            }
            body.dark .about-bottom-link {
                color: #fff;
            }

            /* ─── Scrollbar hide ─────────────────────────────────────── */
            main.wrapper::-webkit-scrollbar {
                display: none;
            }
            main.wrapper {
                scrollbar-width: none;
            }

            /* ─── Pixel View ────────────────────────────────────────── */
            .home__pixel {
                position: fixed;
                inset: 0;
                z-index: 5;
                overflow-y: auto;
                background-color: #fff;
                visibility: hidden;
                opacity: 0;
                transition:
                    opacity 0.4s,
                    visibility 0.4s,
                    background-color var(--duration);
            }
            body.dark .home__pixel { background-color: #000; }
            .home__pixel.open { visibility: visible; opacity: 1; }

            .pixel-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: var(--home-i-i-i-rg);
                padding: var(--home-i-i-i-pd) var(--page-mg);
            }
            @media (max-width: 1024px) { .pixel-grid { grid-template-columns: repeat(3, 1fr); } }
            @media (max-width: 640px)  { .pixel-grid { grid-template-columns: repeat(2, 1fr); } }

            .pixel-card {
                position: relative;
                cursor: crosshair;
                overflow: hidden;
            }
            .pixel-card img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .pixel-card canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 350ms cubic-bezier(0.23, 1, 0.32, 1);
                image-rendering: pixelated;
                pointer-events: none;
            }
            .pixel-card:hover canvas { opacity: 1; }

            /* ─── 3D Globe View ─────────────────────────────────────── */
            .home__3d {
                position: fixed;
                inset: 0;
                z-index: 5;
                background-color: #fff;
                visibility: hidden;
                opacity: 0;
                overflow: hidden;
                transition:
                    opacity 0.4s,
                    visibility 0.4s,
                    background-color var(--duration);
            }
            body.dark .home__3d { background-color: #000; }
            .home__3d.open { visibility: visible; opacity: 1; }

            .scene-3d {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                perspective: 1100px;
                cursor: grab;
                user-select: none;
            }
            .scene-3d.dragging { cursor: grabbing; }

            .globe-3d {
                position: relative;
                width: 0;
                height: 0;
                transform-style: preserve-3d;
            }

            .card-3d {
                position: absolute;
                transform-style: preserve-3d;
                cursor: pointer;
                transition: filter 0.25s;
            }
            .card-3d:hover { filter: brightness(1.15); }
            .card-3d img {
                display: block;
                width: 130px;
                height: auto;
                pointer-events: none;
                box-shadow: 0 6px 28px rgba(0,0,0,0.22);
            }
            body.dark .card-3d img { box-shadow: 0 6px 28px rgba(0,0,0,0.6); }

            /* ─── Transitions ────────────────────────────────────────── */
            .home__feed,
            .home__pixel,
            .home__3d,
            .home__index,
            .home__zoom {
                transition:
                    opacity 0.4s,
                    visibility 0.4s;
            }

        </style>
    </head>
    <body>
        <!-- ─── Nav ──────────────────────────────────────────────── -->
        <nav id="main-nav">
            <div class="nav__top">
                <div class="nav__top__counter" id="counter-top-wrap">
                    <p><span id="counter-top">1</span>/15</p>
                </div>
                <div class="nav__top__count-label" id="count-label">
                    <p>15 Images</p>
                </div>
                <div class="nav__top__title">
                    <p>glry</p>
                </div>
                <div class="nav__top__about nav-btn" id="about-btn">
                    <p>About</p>
                </div>
                <div class="nav__top__right-btns">
                    <span class="nav-btn hidden" id="feed-btn"
                        ><p>Feed</p></span
                    >
                    <span class="nav-btn" id="pixel-btn"><p>Pixel</p></span>
                    <span class="nav-btn" id="threed-btn"><p>3D</p></span>
                    <span class="nav-btn" id="index-btn"><p>Index</p></span>
                    <span class="nav-btn hidden" id="close-btn"
                        ><p>Close</p></span
                    >
                </div>
            </div>
            <div class="nav__bottom">
                <div class="nav__bottom__mobile-counter">
                    <p><span id="counter-mobile">1</span>/15</p>
                </div>
                <div class="nav__bottom__modes">
                    <span class="mode-btn" id="light-btn"><p>Light</p></span>
                    <span class="mode-btn active" id="dark-btn"
                        ><p>Dark</p></span
                    >
                </div>
            </div>
        </nav>

        <!-- ─── Main ─────────────────────────────────────────────── -->
        <main class="wrapper" id="main-wrapper">
            <!-- Feed -->
            <div class="home__feed" id="feed">
                <!-- generated by JS -->
            </div>

            <!-- Pixel -->
            <div class="home__pixel" id="pixel-view">
                <div class="pixel-grid" id="pixel-grid"></div>
            </div>

            <!-- 3D Globe -->
            <div class="home__3d" id="threed-view">
                <div class="scene-3d" id="scene-3d">
                    <div class="globe-3d" id="globe-3d"></div>
                </div>
            </div>

            <!-- Index -->
            <div class="home__index" id="index-view">
                <div class="home__index__inner" id="index-inner">
                    <!-- generated by JS -->
                </div>
            </div>

            <!-- Zoom -->
            <div class="home__zoom" id="zoom-view">
                <div class="zoom-img-wrap">
                    <img id="zoom-img" src="" alt="" />
                </div>
                <div class="zoom-prev" id="zoom-prev"></div>
                <div class="zoom-next" id="zoom-next"></div>
            </div>

            <!-- Zoom cursor -->
            <div class="zoom-cursor" id="zoom-cursor"><p></p></div>
        </main>

        <!-- ─── About ────────────────────────────────────────────── -->
        <div class="about-modal" id="about-modal">
            <div class="about-bg"></div>
            <div class="about-inner">
                <div class="about-inner__content">
                    <div class="about-top">
                        <p class="about-text">
                            glry is a personal photo archive by Mehmet Battal,
                            inspired by <a href="https://swipe.portorocha.com/" target="_blank">Swipe</a>
                            by Felipe Rocha at PORTO ROCHA.
                        </p>
                    </div>
                    <div class="about-bottom">
                        <p class="about-bottom-header">Contact</p>
                        <div class="about-bottom-links">
                            <a
                                href="mailto:mebattll@icloud.com"
                                class="about-bottom-link"
                                ><p>Email</p></a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            /* ─── Image data ─────────────────────────────────────────── */
            const images = [
                { file: "IMG_2133.jpg", w: 4032, h: 3024 },
                { file: "IMG_2159.jpg", w: 4032, h: 3024 },
                { file: "IMG_2464.jpg", w: 4032, h: 3024 },
                { file: "IMG_2600.jpg", w: 4032, h: 3024 },
                { file: "IMG_3047.jpg", w: 4032, h: 3024 },
                { file: "IMG_3277.jpg", w: 4032, h: 3024 },
                { file: "IMG_3397.jpg", w: 4032, h: 3024 },
                { file: "IMG_3497.jpg", w: 4032, h: 3024 },
                { file: "IMG_0570.JPG", w: 1536, h: 2048 },
                { file: "IMG_3511.JPG", w: 1536, h: 2048 },
                { file: "IMG_3513.JPG", w: 1536, h: 2048 },
                { file: "IMG_3554.JPG", w: 1536, h: 2048 },
                { file: "IMG_3609.JPG", w: 1536, h: 2048 },
                { file: "IMG_3615.JPG", w: 2048, h: 1536 },
            ];
            const TOTAL = images.length;

            function imgUrl(i) {
                return `imgs/${encodeURIComponent(images[i - 1].file)}`;
            }

            /* ─── Build Feed ─────────────────────────────────────────── */
            const feed = document.getElementById("feed");
            for (let i = 0; i < TOTAL; i++) {
                const { w, h } = images[i];
                const item = document.createElement("div");
                item.className = "feed-item";
                item.dataset.index = i + 1;
                item.innerHTML = `
        <div class="feed-item__label"><p>${i + 1}/${TOTAL}</p></div>
        <div class="feed-item__img" data-i="${i}" style="aspect-ratio:${w}/${h}">
          <img src="${imgUrl(i + 1)}" alt="${i + 1}/${TOTAL}" loading="${i < 3 ? "eager" : "lazy"}" style="aspect-ratio:${w}/${h}" />
        </div>
      `;
                feed.appendChild(item);
            }


            /* click feed image → open zoom */
            feed.addEventListener("click", (e) => {
                const imgDiv = e.target.closest(".feed-item__img");
                if (!imgDiv) return;
                openZoom(parseInt(imgDiv.dataset.i, 10));
            });

            /* ─── Build Index ────────────────────────────────────────── */
            const indexInner = document.getElementById("index-inner");
            for (let i = 0; i < TOTAL; i++) {
                const { w, h } = images[i];
                const thumb = document.createElement("div");
                thumb.className = "index-thumb";
                thumb.dataset.i = i;
                thumb.innerHTML = `
        <div class="index-thumb__img" style="aspect-ratio:${w}/${h}">
          <img src="${imgUrl(i + 1)}" alt="${i + 1}/${TOTAL}" loading="lazy" />
        </div>
        <span class="index-thumb__num">${i + 1}</span>
      `;
                thumb.addEventListener("click", () => {
                    closeIndex();
                    openZoom(i);
                });
                indexInner.appendChild(thumb);
            }

            /* ─── State ──────────────────────────────────────────────── */
            let currentIndex = 0;
            let indexOpen = false;
            let zoomOpen = false;
            let aboutOpen = false;
            let threedOpen = false;
            let pixelOpen = false;

            const mainWrapper = document.getElementById("main-wrapper");
            const indexView = document.getElementById("index-view");
            const threedView = document.getElementById("threed-view");
            const pixelView = document.getElementById("pixel-view");
            const zoomView = document.getElementById("zoom-view");
            const zoomImg = document.getElementById("zoom-img");
            const aboutModal = document.getElementById("about-modal");
            const counterTop = document.getElementById("counter-top");
            const counterMobile = document.getElementById("counter-mobile");
            const indexBtn = document.getElementById("index-btn");
            const threedBtn = document.getElementById("threed-btn");
            const pixelBtn = document.getElementById("pixel-btn");
            const feedBtn = document.getElementById("feed-btn");
            const closeBtn = document.getElementById("close-btn");
            const aboutBtn = document.getElementById("about-btn");
            const lightBtn = document.getElementById("light-btn");
            const darkBtn = document.getElementById("dark-btn");
            const zoomCursor = document.getElementById("zoom-cursor");

            /* ─── Counter update via scroll ─────────────────────────── */
            const feedItems = document.querySelectorAll(".feed-item");

            const observer = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            const idx = parseInt(
                                entry.target.dataset.index,
                                10,
                            );
                            counterTop.textContent = idx;
                            counterMobile.textContent = idx;
                        }
                    });
                },
                { root: mainWrapper, threshold: 0.5 },
            );

            feedItems.forEach((item) => observer.observe(item));

            const countLabel = document.getElementById("count-label");
            const counterTopWrap = document.getElementById("counter-top-wrap");

            /* ─── Index open/close ───────────────────────────────────── */
            function openIndex() {
                indexOpen = true;
                indexView.classList.add("open");
                indexBtn.classList.add("hidden");
                threedBtn.classList.add("hidden");
                pixelBtn.classList.add("hidden");
                feedBtn.classList.remove("hidden");
                closeBtn.classList.remove("hidden");
                countLabel.classList.add("visible");
                counterTopWrap.style.display = "none";
            }
            function closeIndex() {
                indexOpen = false;
                indexView.classList.remove("open");
                indexBtn.classList.remove("hidden");
                threedBtn.classList.remove("hidden");
                pixelBtn.classList.remove("hidden");
                feedBtn.classList.add("hidden");
                closeBtn.classList.add("hidden");
                countLabel.classList.remove("visible");
                counterTopWrap.style.display = "";
            }
            indexBtn.addEventListener("click", openIndex);

            /* ─── Pixel open/close ───────────────────────────────────── */
            function openPixel() {
                pixelOpen = true;
                pixelView.classList.add("open");
                pixelBtn.classList.add("hidden");
                threedBtn.classList.add("hidden");
                indexBtn.classList.add("hidden");
                feedBtn.classList.remove("hidden");
                closeBtn.classList.remove("hidden");
            }
            function closePixel() {
                pixelOpen = false;
                pixelView.classList.remove("open");
                pixelBtn.classList.remove("hidden");
                threedBtn.classList.remove("hidden");
                indexBtn.classList.remove("hidden");
                feedBtn.classList.add("hidden");
                closeBtn.classList.add("hidden");
            }
            pixelBtn.addEventListener("click", openPixel);

            /* ─── 3D open/close ──────────────────────────────────────── */
            function openThreed() {
                threedOpen = true;
                threedView.classList.add("open");
                threedBtn.classList.add("hidden");
                indexBtn.classList.add("hidden");
                pixelBtn.classList.add("hidden");
                feedBtn.classList.remove("hidden");
                closeBtn.classList.remove("hidden");
                startAutoRotate();
            }
            function closeThreed() {
                threedOpen = false;
                threedView.classList.remove("open");
                threedBtn.classList.remove("hidden");
                indexBtn.classList.remove("hidden");
                pixelBtn.classList.remove("hidden");
                feedBtn.classList.add("hidden");
                closeBtn.classList.add("hidden");
                stopAutoRotate();
            }
            threedBtn.addEventListener("click", openThreed);

            feedBtn.addEventListener("click", () => {
                if (indexOpen) closeIndex();
                if (threedOpen) closeThreed();
                if (pixelOpen) closePixel();
            });

            /* ─── Zoom open/close ────────────────────────────────────── */
            function openZoom(i) {
                currentIndex = i;
                zoomImg.src = imgUrl(i + 1);
                zoomView.classList.add("open");
                closeBtn.classList.remove("hidden");
                indexBtn.classList.add("hidden");
                threedBtn.classList.add("hidden");
                pixelBtn.classList.add("hidden");
                feedBtn.classList.add("hidden");
                zoomOpen = true;
                counterTop.textContent = i + 1;
                counterMobile.textContent = i + 1;
            }
            function closeZoom() {
                zoomView.classList.remove("open");
                zoomOpen = false;
                closeBtn.classList.add("hidden");
                indexBtn.classList.remove("hidden");
                threedBtn.classList.remove("hidden");
                pixelBtn.classList.remove("hidden");
            }

            document
                .getElementById("zoom-prev")
                .addEventListener("click", () => {
                    if (currentIndex > 0) openZoom(currentIndex - 1);
                });
            document
                .getElementById("zoom-next")
                .addEventListener("click", () => {
                    if (currentIndex < TOTAL - 1) openZoom(currentIndex + 1);
                });

            /* ─── Zoom cursor ────────────────────────────────────────── */
            zoomView.addEventListener("mousemove", (e) => {
                const half = window.innerWidth / 2;
                const isPrev = e.clientX < half;
                zoomCursor.style.transform = `translate(${e.clientX}px, ${e.clientY - 20}px)`;
                zoomCursor.classList.add("visible");
                zoomCursor.querySelector("p").textContent = isPrev
                    ? "Prev"
                    : "Next";
            });
            zoomView.addEventListener("mouseleave", () => {
                zoomCursor.classList.remove("visible");
            });

            /* ─── Close button ───────────────────────────────────────── */
            closeBtn.addEventListener("click", () => {
                if (zoomOpen) closeZoom();
                if (indexOpen) closeIndex();
            });

            /* ─── About open/close ───────────────────────────────────── */
            aboutBtn.addEventListener("click", () => {
                aboutOpen = !aboutOpen;
                aboutModal.classList.toggle("open", aboutOpen);
                aboutBtn.querySelector("p").textContent = aboutOpen
                    ? "Close"
                    : "About";
            });
            aboutModal
                .querySelector(".about-bg")
                .addEventListener("click", () => {
                    aboutOpen = false;
                    aboutModal.classList.remove("open");
                    aboutBtn.querySelector("p").textContent = "About";
                });

            /* ─── Dark / Light mode ──────────────────────────────────── */
            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)",
            ).matches;
            let isDark = prefersDark;

            function setDark(dark) {
                isDark = dark;
                document.body.classList.toggle("dark", dark);
                darkBtn.classList.toggle("active", dark);
                lightBtn.classList.toggle("active", !dark);
            }
            setDark(prefersDark);

            darkBtn.addEventListener("click", () => setDark(true));
            lightBtn.addEventListener("click", () => setDark(false));

            /* ─── Keyboard navigation ────────────────────────────────── */
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (aboutOpen) {
                        aboutOpen = false;
                        aboutModal.classList.remove("open");
                        aboutBtn.querySelector("p").textContent = "About";
                    }
                    if (zoomOpen) closeZoom();
                    if (indexOpen) closeIndex();
                    if (threedOpen) closeThreed();
                    if (pixelOpen) closePixel();
                }
                if (zoomOpen) {
                    if (e.key === "ArrowLeft" && currentIndex > 0)
                        openZoom(currentIndex - 1);
                    if (e.key === "ArrowRight" && currentIndex < TOTAL - 1)
                        openZoom(currentIndex + 1);
                }
            });

            /* ─── 3D Globe ───────────────────────────────────────────── */
            const globe = document.getElementById("globe-3d");
            const scene = document.getElementById("scene-3d");
            const RADIUS = Math.min(window.innerWidth, window.innerHeight) * 0.32;

            // Fibonacci sphere — even distribution of N points on a sphere
            function fibPos(n, i) {
                const golden = (1 + Math.sqrt(5)) / 2;
                const theta = Math.acos(1 - (2 * (i + 0.5)) / n);
                const phi = (2 * Math.PI * i) / golden;
                return {
                    x: RADIUS * Math.sin(theta) * Math.cos(phi),
                    y: RADIUS * Math.cos(theta),
                    z: RADIUS * Math.sin(theta) * Math.sin(phi),
                };
            }

            for (let i = 0; i < TOTAL; i++) {
                const { x, y, z } = fibPos(TOTAL, i);
                const yaw = Math.atan2(x, z) * (180 / Math.PI);
                const pitch = -Math.atan2(y, Math.sqrt(x * x + z * z)) * (180 / Math.PI);
                const card = document.createElement("div");
                card.className = "card-3d";
                card.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${yaw}deg) rotateX(${pitch}deg)`;
                card.innerHTML = `<img src="${imgUrl(i + 1)}" alt="${i + 1}/${TOTAL}" />`;
                card.addEventListener("click", () => {
                    if (!wasDragging) openZoom(i);
                });
                globe.appendChild(card);
            }

            // Rotation state
            let rotX = -10, rotY = 0;
            let velX = 0, velY = 0;
            let dragging = false;
            let wasDragging = false;
            let lastMX, lastMY;
            let dragRafId, autoRafId;

            function applyRot() {
                globe.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            }
            applyRot();

            function stopAutoRotate() { cancelAnimationFrame(autoRafId); }

            function startAutoRotate() {
                stopAutoRotate();
                function tick() {
                    if (dragging) { autoRafId = requestAnimationFrame(tick); return; }
                    rotY += 0.12;
                    applyRot();
                    autoRafId = requestAnimationFrame(tick);
                }
                autoRafId = requestAnimationFrame(tick);
            }

            function startInertia() {
                cancelAnimationFrame(dragRafId);
                function tick() {
                    if (Math.abs(velX) < 0.02 && Math.abs(velY) < 0.02) {
                        startAutoRotate();
                        return;
                    }
                    velX *= 0.93;
                    velY *= 0.93;
                    rotX += velX;
                    rotY += velY;
                    applyRot();
                    dragRafId = requestAnimationFrame(tick);
                }
                dragRafId = requestAnimationFrame(tick);
            }

            // Mouse
            scene.addEventListener("mousedown", (e) => {
                dragging = true;
                wasDragging = false;
                lastMX = e.clientX;
                lastMY = e.clientY;
                velX = velY = 0;
                cancelAnimationFrame(dragRafId);
                stopAutoRotate();
                scene.classList.add("dragging");
                e.preventDefault();
            });

            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastMX;
                const dy = e.clientY - lastMY;
                if (Math.abs(dx) + Math.abs(dy) > 3) wasDragging = true;
                velY = dx * 0.35;
                velX = dy * 0.35;
                rotY += velY;
                rotX += velX;
                applyRot();
                lastMX = e.clientX;
                lastMY = e.clientY;
            });

            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;
                scene.classList.remove("dragging");
                startInertia();
                setTimeout(() => { wasDragging = false; }, 50);
            });

            // Touch
            scene.addEventListener("touchstart", (e) => {
                dragging = true;
                wasDragging = false;
                lastMX = e.touches[0].clientX;
                lastMY = e.touches[0].clientY;
                velX = velY = 0;
                cancelAnimationFrame(dragRafId);
                stopAutoRotate();
            }, { passive: true });

            window.addEventListener("touchmove", (e) => {
                if (!dragging) return;
                const dx = e.touches[0].clientX - lastMX;
                const dy = e.touches[0].clientY - lastMY;
                if (Math.abs(dx) + Math.abs(dy) > 3) wasDragging = true;
                velY = dx * 0.35;
                velX = dy * 0.35;
                rotY += velY;
                rotX += velX;
                applyRot();
                lastMX = e.touches[0].clientX;
                lastMY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener("touchend", () => {
                if (!dragging) return;
                dragging = false;
                startInertia();
                setTimeout(() => { wasDragging = false; }, 50);
            });

            /* ─── Pixel / Dither view ───────────────────────────────── */
            // Bayer 8×8 ordered-dithering threshold matrix (0–63)
            const bayer8 = [
                [ 0, 32,  8, 40,  2, 34, 10, 42],
                [48, 16, 56, 24, 50, 18, 58, 26],
                [12, 44,  4, 36, 14, 46,  6, 38],
                [60, 28, 52, 20, 62, 30, 54, 22],
                [ 3, 35, 11, 43,  1, 33,  9, 41],
                [51, 19, 59, 27, 49, 17, 57, 25],
                [15, 47,  7, 39, 13, 45,  5, 37],
                [63, 31, 55, 23, 61, 29, 53, 21],
            ];

            function ditherToCanvas(img, canvas) {
                const BLOCK = 5; // sample every N pixels → defines pixel size
                const sw = Math.max(1, Math.floor(img.naturalWidth  / BLOCK));
                const sh = Math.max(1, Math.floor(img.naturalHeight / BLOCK));

                // Down-sample image into a tiny temp canvas
                const tmp = document.createElement("canvas");
                tmp.width  = sw;
                tmp.height = sh;
                const tctx = tmp.getContext("2d");
                tctx.drawImage(img, 0, 0, sw, sh);
                const { data } = tctx.getImageData(0, 0, sw, sh);

                // Write dithered pixels to the output canvas at the same tiny size;
                // CSS + image-rendering:pixelated scales it up to fill the card
                canvas.width  = sw;
                canvas.height = sh;
                const ctx = canvas.getContext("2d");
                const out = ctx.createImageData(sw, sh);

                for (let y = 0; y < sh; y++) {
                    for (let x = 0; x < sw; x++) {
                        const i = (y * sw + x) * 4;
                        const gray =
                            0.299 * data[i] +
                            0.587 * data[i + 1] +
                            0.114 * data[i + 2];
                        const threshold = (bayer8[y % 8][x % 8] / 64) * 255;
                        const v = gray > threshold ? 255 : 0;
                        out.data[i]     = v;
                        out.data[i + 1] = v;
                        out.data[i + 2] = v;
                        out.data[i + 3] = 255;
                    }
                }
                ctx.putImageData(out, 0, 0);
            }

            const pixelGrid = document.getElementById("pixel-grid");
            for (let i = 0; i < TOTAL; i++) {
                const { w, h } = images[i];
                const card = document.createElement("div");
                card.className = "pixel-card";
                card.style.aspectRatio = `${w}/${h}`;

                const img = document.createElement("img");
                img.src = imgUrl(i + 1);
                img.alt = `${i + 1}/${TOTAL}`;
                img.loading = "lazy";

                const cvs = document.createElement("canvas");
                let painted = false;

                // Dither lazily on first hover to avoid blocking on load
                card.addEventListener("mouseenter", () => {
                    if (!painted && img.complete && img.naturalWidth) {
                        try { ditherToCanvas(img, cvs); painted = true; }
                        catch (_) {}   // CORS guard — graceful silent fail
                    }
                });
                // If image loads after hover already happened
                img.addEventListener("load", () => {
                    if (!painted) {
                        try { ditherToCanvas(img, cvs); painted = true; }
                        catch (_) {}
                    }
                });

                card.appendChild(img);
                card.appendChild(cvs);
                card.addEventListener("click", () => {
                    openZoom(i);
                    closePixel();
                });
                pixelGrid.appendChild(card);
            }

            /* ─── Scroll pop-in animation ────────────────────────────── */
            const popObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("popped");
                            popObserver.unobserve(entry.target);
                        }
                    });
                },
                { root: mainWrapper, threshold: 0.15 },
            );
            feed.querySelectorAll(".feed-item__img").forEach((el) =>
                popObserver.observe(el),
            );
        </script>
    </body>
</html>
